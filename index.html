<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PONG 3D</title>
  <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
  <canvas id="game-canvas"></canvas>
  <div id="ui-overlay">
    <div id="score-display" class="hidden">
      <span id="player-score">0</span>
      <span id="score-separator">:</span>
      <span id="opponent-score">0</span>
    </div>
    <div id="combo-display" class="hidden">
      <span id="combo-count">0</span>
      <span id="combo-label">RALLY</span>
    </div>
    <div id="powerup-toast" class="hidden"></div>
    <div id="taunt-bubble" class="hidden"></div>
    <div id="view-controls">
      <button id="btn-swap-sides" title="Trade places with opponent">&#8646; SIDES</button>
      <label title="Orbit view left/right">&#10230;
        <input type="range" id="view-yaw" min="-45" max="45" step="1" value="0">
      </label>
      <label title="Raise/lower camera">&#8597;
        <input type="range" id="view-tilt" min="-60" max="100" step="5" value="0">
      </label>
      <label title="Zoom in (stops before the court is cut off)">&#8853;
        <input type="range" id="view-zoom" min="0" max="100" step="5" value="0">
      </label>
    </div>

    <div id="menu-screen" class="screen">
      <h1>PONG 3D</h1>
      <p class="subtitle">Isometric Neon Pong</p>
      <p id="menu-records" class="subtitle hidden"></p>
      <p id="menu-achievements" class="subtitle hidden"></p>
      <button id="btn-play" class="neon-btn">PLAY</button>
      <button id="btn-settings" class="neon-btn">SETTINGS</button>
    </div>

    <div id="pause-screen" class="screen hidden">
      <h2>PAUSED</h2>
      <button id="btn-resume" class="neon-btn">RESUME</button>
      <button id="btn-quit" class="neon-btn">QUIT</button>
    </div>

    <div id="gameover-screen" class="screen hidden">
      <h2 id="gameover-text">YOU WIN!</h2>
      <p id="final-score" class="final-score">11 : 5</p>
      <button id="btn-again" class="neon-btn">PLAY AGAIN</button>
      <button id="btn-menu" class="neon-btn">MENU</button>
    </div>

    <div id="settings-screen" class="screen hidden">
      <h2>SETTINGS</h2>
      <div class="setting-row">
        <label>Opponent</label>
        <select id="setting-playermode">
          <option value="ai" selected>vs CPU</option>
          <option value="versus">2 Players (local)</option>
        </select>
      </div>
      <div class="setting-row">
        <label>Difficulty</label>
        <select id="setting-difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="setting-row">
        <label>Win Score</label>
        <select id="setting-winscore">
          <option value="5">5</option>
          <option value="7">7</option>
          <option value="11" selected>11</option>
          <option value="15">15</option>
        </select>
      </div>
      <div class="setting-row">
        <label>Game Mode</label>
        <select id="setting-gamemode">
          <option value="classic">Classic (Dull)</option>
          <option value="fun" selected>Fun (Spin + Speed + Combo)</option>
          <option value="boss">Boss Rush (special AI rules)</option>
        </select>
      </div>
      <div class="setting-row">
        <label>Deuce (win by 2)</label>
        <select id="setting-deuce">
          <option value="true" selected>On</option>
          <option value="false">Off</option>
        </select>
      </div>
      <div class="setting-row checkbox-row">
        <label>
          <input type="checkbox" id="setting-bloom" checked>
          Bloom glow (neon post-processing)
        </label>
      </div>
      <div class="setting-row checkbox-row">
        <label>
          <input type="checkbox" id="setting-catchmode">
          Catch mode (slower returns — beginner assist)
        </label>
      </div>
      <div class="setting-row checkbox-row">
        <label>
          <input type="checkbox" id="setting-music" checked>
          Rally music (builds with combo)
        </label>
      </div>
      <div class="setting-row checkbox-row">
        <label>
          <input type="checkbox" id="setting-gamepad" checked>
          Gamepad support (pad 1 = P1, pad 2 = P2 in versus)
        </label>
      </div>
      <div class="setting-row checkbox-row">
        <label>
          <input type="checkbox" id="setting-daily">
          Daily challenge (same random seed for everyone today)
        </label>
      </div>
      <div class="setting-row checkbox-row">
        <label>
          <input type="checkbox" id="setting-steervertical">
          Vertical steering (mouse/stick up-down moves the paddle)
        </label>
      </div>
      <div id="fun-settings">
        <h3 class="fun-label">FUN MODE EXTRAS</h3>
        <div class="setting-row checkbox-row">
          <label>
            <input type="checkbox" id="setting-powerups" checked>
            Power-ups (paddle boost, shrink opponent, slow-mo, double points)
          </label>
        </div>
        <div class="setting-row checkbox-row">
          <label>
            <input type="checkbox" id="setting-multiball" checked>
            Multi-ball (2nd ball at 10+ combo)
          </label>
        </div>
        <div class="setting-row checkbox-row">
          <label>
            <input type="checkbox" id="setting-paddleshifts" checked>
            Paddle shifts (edge hit shrinks AI, center hit grows AI)
          </label>
        </div>
        <div class="setting-row checkbox-row">
          <label>
            <input type="checkbox" id="setting-aitaunts" checked>
            AI personalities + taunts
          </label>
        </div>
        <div class="setting-row checkbox-row">
          <label>
            <input type="checkbox" id="setting-netgraze" checked>
            Net graze (rare lucky deflection at the net)
          </label>
        </div>
      </div>
      <button id="btn-save-settings" class="neon-btn">SAVE</button>
      <button id="btn-back" class="neon-btn">BACK</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
